<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer></script>
    <title>Calculator</title>
</head>
<body>
    <div class="calculator">
        <div class="display"></div>

        <div class="buttons">
            <div class="main-keys">
                <div class="controls">
                    <button class="btn all-clear">AC</button>
                    <button class="btn percentage">%</button>
                    <button class="btn delete">⌫</button>
                </div>

                <div id="numbers-container">
                    <button class="btn number" id="one">1</button>
                    <button class="btn number" id="two">2</button>
                    <button class="btn number" id="three">3</button>
                    <button class="btn number" id="four">4</button>
                    <button class="btn number" id="five">5</button>
                    <button class="btn number" id="six">6</button>
                    <button class="btn number" id="seven">7</button>
                    <button class="btn number" id="eight">8</button>
                    <button class="btn number" id="nine">9</button>
                    <button class="btn number" id="double-zero">00</button>
                    <button class="btn number" id="zero">0</button> 
                    <button class="btn number" id="decimal-point">.</button>
                </div>                
            </div>

            <div class="operators">

                <button class="btn operator divide">÷</button>
                <button class="btn operator multiply">X</button>
                <button class="btn operator subtract">-</button>
                <button class="btn operator add">+</button>
                <button class="btn equal">=</button>
            </div>
        </div>
    </div>

</body>
</html>
